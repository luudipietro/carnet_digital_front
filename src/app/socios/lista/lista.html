<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card card-mutual shadow-lg overflow-hidden p-1 border-2" style="border-color: #f1c40f !important;">

        <div class="card-header bg-transparent text-center pt-4 pb-2 border-0">
          <img src="logo_mutual_blanco.png" alt="Logo Mutual" height="60" class="mb-2">
          <h2 class="h5 fw-bold text-white mb-0 text-uppercase tracking-tight">
            Mutual Sueño Amarillo
          </h2>
        </div>

        @if (deudaSocio(); as socio) {
          <div class="card-body text-center p-0">
            
            <h3 class="h4 fw-normal text-white mb-0 text-uppercase">{{ socio.nombre }}</h3>
            <p class="text-secondary-light mb-4">CUIT: {{ socio.cuit }}</p>

            <div class="status-box mb-4 d-flex align-items-center justify-content-center"
                 [class.border-active]="socio.estado === 'Activo'">
              
              <h1 class="status-text fw-black text-uppercase mb-0 fst-italic">
                SOCIO {{ socio.estado }}
                @if (socio.estado === 'Activo') {
                  <i class="fas fa-check ms-2"></i>
                }
              </h1>
            </div>

            <div class="d-flex justify-content-center">
              <button class="btn btn-consultar text-uppercase" 
                      (click)="cargar(socio.cuit.toString())">
                Consultar Nuevamente
              </button>
             </div>
          </div>

        } @else {
          <div class="card-body text-center p-5">
            <div class="spinner-border text-brand-yellow mb-4" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <h4 class="text-white fw-bold">Buscando Socio...</h4>
          </div>
        }
      </div>

    </div>
  </div>
</div>
